# The nightly run for the deployed game: look for new work, ship the snapshot,
# reprice.
#
# The fetch happens here rather than on Fly because this is where the API keys
# and the fetch cache live, and because an hour-long job does not belong inside
# a web request. The app then takes the finished snapshot over HTTP - which
# also wakes the machine, since it suspends when nobody is browsing.
#
# Both endpoints are idempotent: a day already marked is never marked twice,
# and a snapshot that has lost most of the roster is refused rather than
# written.
name: Reprice the market

on:
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:
    inputs:
      dividends:
        description: "Also pay the quarterly dividend"
        type: boolean
        default: false
      skip_refresh:
        description: "Reprice only - do not look for new credits"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.FSX_HOST }}
      TOKEN: ${{ secrets.FSX_JOB_TOKEN }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check the setup
        run: |
          if [ -z "$HOST" ] || [ -z "$TOKEN" ]; then
            echo "::error::FSX_HOST or FSX_JOB_TOKEN is not set in repository secrets."
            exit 1
          fi

      # Permanent by design for films, dated for filmographies - so this is
      # what keeps the nightly check to one call per person instead of a
      # cold refetch of everything. Restore and save are separate steps
      # because actions/cache only saves when the job succeeds, and a job
      # that fails on the refresh is exactly the one whose cache is worth
      # keeping - otherwise every retry starts cold and fails the same way.
      - name: Restore the fetch cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: fsx-fetch-${{ github.run_id }}
          restore-keys: fsx-fetch-

      # Prices are a function of the date: yesterday's snapshot produces
      # today's prices whether or not anyone has released anything. So a bad
      # night at TMDB must not stop the repricing - the market being four
      # years stale was worse than the market missing a week of new credits.
      - name: Look for new credits
        id: refresh
        continue-on-error: true
        if: ${{ !inputs.skip_refresh && env.TMDB_READ_ACCESS_TOKEN != '' }}
        run: python -m fsx.cli refresh --snapshot data/people.json

      # The cache is restored above, so this costs no API calls: it re-reads
      # the payloads the refresh already downloaded and pulls the poster and
      # headshot paths out of them.
      - name: Rebuild the image index
        if: ${{ !inputs.skip_refresh && steps.refresh.outcome == 'success' }}
        run: python scripts/build_images.py

      - name: Ship the snapshot
        if: ${{ !inputs.skip_refresh && steps.refresh.outcome == 'success' }}
        run: |
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            --max-time 300 --retry 3 --retry-delay 20 --retry-connrefused \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @data/people.json \
            "https://$HOST/jobs/snapshot")
          cat response.json; echo
          test "$code" = "200"

      # Always: this is the step that keeps the market's date honest, and the
      # app closes any gap it finds before it marks.
      - name: Reprice
        if: ${{ always() }}
        run: |
          code=$(curl -sS -o mark.json -w '%{http_code}' -X POST \
            --max-time 300 --retry 3 --retry-delay 20 --retry-connrefused \
            -H "Authorization: Bearer $TOKEN" \
            "https://$HOST/jobs/mark?dividends=${{ inputs.dividends && 1 || 0 }}")
          cat mark.json; echo
          test "$code" = "200"

      # The refreshed snapshot is also what the static site and the next run
      # build from, so it belongs in the repo rather than only on the volume.
      - name: Commit the snapshot
        if: ${{ !inputs.skip_refresh && steps.refresh.outcome == 'success' }}
        run: |
          if git diff --quiet -- data/people.json data/images.json; then
            echo "No change to the snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people.json data/images.json
          git commit -m "Nightly refresh: new credits and awards"
          git push

      - name: Save the fetch cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: fsx-fetch-${{ github.run_id }}

      # Last, so that a failed refresh still shows up red without having
      # stopped the repricing above.
      - name: Report a failed refresh
        if: ${{ steps.refresh.outcome == 'failure' }}
        run: |
          echo "::error::The credit refresh failed. The market was repriced"\
               " anyway; see the 'Look for new credits' step for the reason."
          exit 1
