# The nightly reprice, for the deployed game.
#
# It is an HTTP call rather than a scheduled machine because SQLite lives on a
# Fly volume, a volume attaches to one machine at a time, and the web app holds
# it. The request also wakes the machine, which suspends when nobody is
# browsing - so this both triggers the job and provides the reason the machine
# is awake to run it.
#
# Marking is idempotent: a day already marked is never marked twice, however
# many times this fires.
name: Reprice the market

on:
  schedule:
    - cron: "40 9 * * *"        # 09:40 UTC, after the US close and the Pages build
  workflow_dispatch:
    inputs:
      dividends:
        description: "Also pay the quarterly dividend"
        type: boolean
        default: false

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Reprice
        env:
          HOST: ${{ secrets.FSX_HOST }}
          TOKEN: ${{ secrets.FSX_JOB_TOKEN }}
        run: |
          if [ -z "$HOST" ] || [ -z "$TOKEN" ]; then
            echo "FSX_HOST or FSX_JOB_TOKEN is not set; nothing to call."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            --max-time 120 --retry 3 --retry-delay 20 --retry-connrefused \
            -H "Authorization: Bearer $TOKEN" \
            "https://$HOST/jobs/mark?dividends=${{ inputs.dividends && 1 || 0 }}")
          cat response.json; echo
          test "$code" = "200"
