# The test suite on every push and pull request, separate from the nightly
# rebuild - that one also deploys Pages, so a Pages problem must not read as a
# failing test suite.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what Apple ships as /usr/bin/python3, so it is what the app
        # meets on a Mac that has not installed anything. A `str | None` in a
        # route signature is evaluated at import and breaks there and only
        # there - which is a failure you find by starting the app, not by
        # reading the diff. This makes it a red build instead.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests/ -q
      - name: No page links to a dead one
        run: python scripts/crawl.py
