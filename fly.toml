# Rename this app before deploying: the name must be unique across fly.io.
app = "film-stock-exchange"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FSX_DB = "/data/market.db"
  FSX_ENV = "production"

# SQLite lives on the volume, never in the image - otherwise every deploy
# wipes every portfolio.
[[mounts]]
  source = "market_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
